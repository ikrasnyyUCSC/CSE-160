<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <title>Blocky World</title>
  <style>
    body { margin: 0; background: #111; display: flex; flex-direction: column; align-items: center; }
    canvas { display: block; cursor: crosshair; }
    #ui {
      color: #eee; font-family: monospace; font-size: 13px;
      display: flex; gap: 16px; align-items: center;
      padding: 6px 10px; background: #222; width: 800px; box-sizing: border-box;
    }
    #ui span { color: #aaa; }
    #fpsDisplay { color: #4f4; font-weight: bold; }
    #crosshair {
      position: absolute; pointer-events: none;
      top: 50%; left: 50%; transform: translate(-50%, -50%);
      color: white; font-size: 20px; line-height: 1;
      text-shadow: 0 0 3px black;
    }
    #hud {
      position: absolute; pointer-events: none;
      top: 16px; left: 50%; transform: translateX(-50%);
      color: white; font-family: monospace; font-size: 15px;
      text-align: center; text-shadow: 0 0 6px black;
    }
    #hud #gameMsg { font-size: 20px; font-weight: bold; color: #ffe066; }
    #hud #gameTimer { margin-top: 4px; color: #ccc; }
    #wrapper { position: relative; }
    #hint { color: #888; font-size: 11px; font-family: monospace; padding: 4px 10px; background: #1a1a1a; width: 800px; box-sizing: border-box; }
  </style>
</head>
<body>
  <div id="ui">
    <span>FPS: <b id="fpsDisplay">--</b></span>
    <span>WASD=move &nbsp; QE=turn &nbsp; Mouse=look &nbsp; F=add &nbsp; G=delete &nbsp; T=dance &nbsp; Scroll=texture: <b id="texLabel">Brick</b></span>
  </div>
  <div id="wrapper">
    <canvas id="webgl" width="800" height="600"></canvas>
    <div id="crosshair">+</div>
    <div id="hud">
      <div id="gameMsg">Find the dancing cow!</div>
      <div id="gameTimer">Time: 0.0s</div>
    </div>
  </div>
  <div id="hint">Pointer lock: click canvas to capture mouse. ESC to release.</div>

  <script src="lib/cuon-utils.js"></script>
  <script src="lib/cuon-matrix-cse160.js"></script>
  <script src="lib/webgl-utils.js"></script>
  <script src="animal.js"></script>
  <script src="world.js"></script>
</body>
</html>
